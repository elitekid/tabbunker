<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>TabBunker Vault</title>
  <link rel="stylesheet" href="../shared/theme.css">
  <link rel="stylesheet" href="vault.css">
</head>
<body>
  <header class="vault-top">
    <div class="vault-top-in">
      <h1 data-i18n="vaultTitle">TabBunker Vault</h1>
      <div class="vault-top-actions">
        <input type="search" id="search" class="search-input" data-i18n-placeholder="searchPlaceholder" data-i18n-aria="searchPlaceholder">
        <button id="btn-import" type="button" class="btn" data-i18n="import">Import</button>
        <button id="btn-export" type="button" class="btn" data-i18n="export">Export</button>
        <button id="btn-settings" type="button" class="btn" data-i18n="settings">Settings</button>
      </div>
    </div>
    <div class="vault-backup">
      <div class="vault-backup-lines" aria-live="polite">
        <p id="backup-line-snapshot" class="backup-status-line"></p>
        <p id="backup-line-file" class="backup-status-line"></p>
      </div>
      <div class="vault-backup-actions">
        <button id="btn-backup-now" type="button" class="btn" data-i18n="backupNow">Back up now</button>
        <button id="btn-backup-restore" type="button" class="btn" data-i18n="backupRestoreFromFile">Restore from backup file</button>
      </div>
      <p id="backup-cleanup-failed" class="backup-extra hidden" data-i18n="backupCleanupFailed"></p>
      <p id="backup-dated-failed" class="backup-extra hidden" data-i18n="backupDatedFailed"></p>
      <p id="backup-restore-hint" class="backup-hint hidden" data-i18n="backupRestoreHint"></p>
    </div>
  </header>

  <div id="toast" class="app-toast hidden" role="status" aria-live="polite"></div>

  <div id="review-banner" class="review-banner hidden" role="status" aria-live="polite">
    <p id="review-banner-text" class="review-banner-text" data-i18n="reviewPromptBody"></p>
    <div class="review-banner-actions">
      <button id="btn-review-write" type="button" class="btn primary" data-i18n="reviewWrite"></button>
      <button id="btn-review-dismiss" type="button" class="btn" data-i18n="reviewDismiss"></button>
      <a id="link-review-report" class="review-banner-link" href="#" target="_blank" rel="noopener" data-i18n="reportProblem"></a>
    </div>
  </div>

  <div id="collapse-banner" class="collapse-banner hidden" role="status" aria-live="polite">
    <span id="collapse-banner-text"></span>
    <button id="btn-collapse-undo" type="button" class="btn" data-i18n="undoBtn">Undo</button>
  </div>

  <main id="main" class="main">
    <div id="empty-state" class="empty-state-panel hidden">
      <p class="empty-state-title" data-i18n="vaultEmptyTitle">No saved tabs yet</p>
      <p class="empty-state-body" data-i18n="vaultEmptyBody"></p>
      <button id="btn-import-empty" type="button" class="btn" data-i18n="importExisting">Import from another tab manager</button>
    </div>
    <p id="search-nomatch" class="empty-nomatch hidden" data-i18n="popupNoMatch">No tabs match your search</p>
    <div id="group-list" class="group-list" role="list" data-i18n-aria="ariaGroupList"></div>
    <div id="pagination" class="pagination hidden" data-i18n-aria="ariaPagination"></div>
  </main>

  <dialog id="import-dialog" aria-labelledby="import-dialog-title">
    <h2 id="import-dialog-title" data-i18n="importPreview">Import Preview</h2>
    <div id="import-preview" class="preview"></div>
    <div class="dialog-actions">
      <button id="btn-import-merge" type="button" class="btn primary" data-i18n="merge">Merge</button>
      <button id="btn-import-replace" type="button" class="btn danger" data-i18n="replace">Replace All</button>
      <button id="btn-import-cancel" type="button" class="btn" data-i18n="cancel" autofocus>Cancel</button>
    </div>
  </dialog>

  <dialog id="export-dialog" aria-labelledby="export-dialog-title">
    <h2 id="export-dialog-title" data-i18n="exportTitle">Export</h2>
    <label>
      <span data-i18n="exportFormat">Format</span>
      <select id="export-format">
        <option value="json" data-i18n="exportJson">TabBunker JSON</option>
        <option value="onetab" data-i18n="exportOneTab">OneTab Text</option>
        <option value="html" data-i18n="exportHtml">HTML Bookmarks</option>
      </select>
    </label>
    <div class="dialog-actions">
      <button id="btn-export-download" type="button" class="btn primary" data-i18n="download">Download</button>
      <button id="btn-export-cancel" type="button" class="btn" data-i18n="cancel">Cancel</button>
    </div>
  </dialog>

  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title">
    <p id="confirm-title"></p>
    <div class="dialog-actions">
      <button id="btn-confirm-ok" type="button" class="btn primary" data-i18n="popupConfirmOpen">Open</button>
      <button id="btn-confirm-cancel" type="button" class="btn" data-i18n="cancel">Cancel</button>
    </div>
  </dialog>

  <input type="file" id="file-input" accept=".json,.txt,.html" hidden>

  <script type="module" src="vault.js"></script>
</body>
</html>
